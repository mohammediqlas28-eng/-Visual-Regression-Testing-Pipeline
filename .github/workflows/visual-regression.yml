name: Visual Regression Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium firefox webkit

      - name: Start demo website
        run: |
          python -m http.server 8000 > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done

      - name: Run visual regression tests
        id: visual
        continue-on-error: true
        run: python visual_regression.py

      - name: Upload screenshots, diffs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            artifacts/
            server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Comment results on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.visual.outcome }}';
            const body = `## Visual Regression Results\n\n` +
              `**Status:** ${outcome === 'success' ? '✅ Passed' : '❌ Failed'}\n\n` +
              `Screenshots, difference images, and the HTML report are available in the **visual-regression-report** artifact attached to this workflow run.\n\n` +
              `If the changes are intentional, review the report, update baselines locally with \`python visual_regression.py --update-baselines\`, commit the updated \`baselines/\` folder, and push again.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Visual Regression Results'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail workflow when visual tests fail
        if: steps.visual.outcome == 'failure'
        run: exit 1
